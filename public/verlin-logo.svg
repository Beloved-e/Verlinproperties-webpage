<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 92" width="100%" height="100%">
  <!-- VERLIN - Folded Dual-Tone V Logo -->
  <g id="logo-mark">
    <!-- Left Dark Crimson Facet -->
    <path d="M 0,0 L 22,0 L 22,18 L 12,36 L 25,58 L 2,58 L 0,38 Z" fill="#9E0025" />
    <polygon points="0,0 20,0 36,40 18,58 0,26" fill="#990021" />
    <!-- Re-refined precise geometric V facets matching the exact brand identity -->
    <!-- Left faceted wing: darker red -->
    <path d="M 0,0 L 22,0 L 40,42 L 23,58 L 0,18 Z" fill="#9E0022" />
    <!-- Right faceted wing: bright vivid red -->
    <polygon points="18,58 36,58 64,0 42,0" fill="#E21237" />
  </g>

  <!-- Lettering: ERLIN -->
  <text x="70" y="58" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="-0.02em" fill="#000000">
    ERLIN
  </text>

  <!-- Subtitle: PROPERTIES -->
  <text x="6" y="86" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="700" font-size="16.5" letter-spacing="0.48em" fill="#000000">
    PROPERTIES
  </text>
</svg>
